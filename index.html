<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacanian Clock</title>
    <style>
        /* ========================================
           CSS Variables - Theme Colors
           ======================================== */
        :root {
            --text-color: #171918;
            --text-secondary: rgba(23, 25, 24, 0.62);
            --text-muted: rgba(23, 25, 24, 0.42);
            --panel-bg: rgba(246, 247, 243, 0.96);
            --panel-border: rgba(51, 65, 59, 0.18);
            --slider-track: rgba(58, 67, 63, 0.16);
            --slider-thumb: #9E3F31;
            --bg-top: #F1F3EF;
            --bg-bottom: #DCE1DD;
            --accent: #9E3F31;
            --field-line: rgba(52, 68, 60, 0.09);
            --shadow-color: rgba(29, 39, 35, 0.12);
        }

        [data-theme="dark"] {
            --text-color: #F3E8D0;
            --text-secondary: rgba(243, 232, 208, 0.62);
            --text-muted: rgba(243, 232, 208, 0.34);
            --panel-bg: rgba(15, 29, 25, 0.94);
            --panel-border: rgba(243, 232, 208, 0.16);
            --slider-track: rgba(243, 232, 208, 0.16);
            --slider-thumb: #C1644F;
            --bg-top: #182721;
            --bg-bottom: #070A09;
            --accent: #C1644F;
            --field-line: rgba(232, 216, 176, 0.075);
            --shadow-color: rgba(0, 0, 0, 0.32);
        }

        /* ========================================
           Global Reset & Base Styles
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua",
                         Georgia, "Noto Serif SC", "Songti SC", serif;
            background:
                linear-gradient(90deg, var(--field-line) 1px, transparent 1px),
                linear-gradient(0deg, var(--field-line) 1px, transparent 1px),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-size: 72px 72px, 72px 72px, 100% 100%;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 25vh;
            opacity: 0;
            animation: fadeInPage 0.65s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        html {
            overflow-x: hidden;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ========================================
           Time Display (On Background)
           ======================================== */
        .time {
            font-size: 160px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1;
            font-feature-settings: "tnum" on, "zero" on;
            color: var(--text-color);
            transition: color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            animation: fadeInTime 0.65s 0.15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            text-shadow: 0 18px 42px var(--shadow-color);
        }

        @keyframes fadeInTime {
            from {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* Parallax wrapper for 2.5D effect */
        .parallax-wrapper {
            perspective: 1000px;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .lacan-title {
            margin-bottom: 22px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInTime 0.55s 0.05s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .rsi-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 34px;
            width: min(520px, calc(100vw - 48px));
            opacity: 0;
            animation: fadeInTime 0.55s 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .rsi-term {
            border-top: 1px solid var(--panel-border);
            padding-top: 10px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0;
            text-align: center;
            text-transform: uppercase;
        }

        /* ========================================
           Quote Section (On Background)
           ======================================== */
        .quote {
            margin-top: 40px;
            font-size: 22px;
            font-weight: 500;
            color: var(--text-secondary);
            width: min(600px, calc(100vw - 48px));
            overflow-wrap: anywhere;
            line-height: 1.7;
            text-align: center;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quote.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .quote-author {
            margin-top: 12px;
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.28s ease;
        }

        .quote-author.is-hidden {
            opacity: 0;
        }

        .quote-text {
            display: block;
            min-height: 1.7em;
        }

        .quote-text.typing::after {
            content: "";
            display: inline-block;
            width: 0.08em;
            height: 1em;
            margin-left: 3px;
            background: var(--accent);
            vertical-align: -0.12em;
            animation: caretBlink 1s steps(1, end) infinite;
        }

        @keyframes caretBlink {
            0%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }

        /* ========================================
           Theme Toggle Button
           ======================================== */
        .theme-toggle {
            position: fixed;
            top: 32px;
            right: 32px;
            width: 52px;
            height: 28px;
            border-radius: 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 3px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .toggle-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px var(--shadow-color);
        }

        .toggle-icon {
            width: 12px;
            height: 12px;
            fill: white;
        }

        [data-theme="dark"] .toggle-thumb {
            transform: translateX(24px);
        }

        /* ========================================
           Settings Gear Button
           ======================================== */
        .settings-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--shadow-color);
            z-index: 1000;
        }

        .settings-btn:hover {
            transform: rotate(90deg) scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .settings-btn:active {
            transform: rotate(90deg) scale(0.95);
        }

        .gear-icon {
            width: 20px;
            height: 20px;
            fill: var(--text-color);
            transition: fill 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========================================
           Settings Panel
           ======================================== */
        .settings-panel {
            position: fixed;
            bottom: 90px;
            right: 32px;
            width: 280px;
            padding: 14px;
            border-radius: 8px;
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 32px var(--shadow-color);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .settings-panel.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .settings-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
        }

        .setting-item {
            margin-bottom: 14px;
        }

        .setting-item:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .setting-value {
            font-weight: 600;
            color: var(--text-color);
        }

        /* Range Slider */
        .range-slider {
            width: 100%;
            height: 3px;
            border-radius: 1.5px;
            background: var(--slider-track);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--slider-thumb);
            cursor: pointer;
            box-shadow: 0 1px 4px var(--shadow-color);
            transition: transform 0.2s ease;
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .range-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--slider-thumb);
            cursor: pointer;
            border: none;
            box-shadow: 0 1px 4px var(--shadow-color);
        }

        /* Parallax Intensity Selector */
        .intensity-selector {
            display: flex;
            gap: 8px;
        }

        .intensity-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .intensity-btn:hover {
            background: rgba(120, 120, 130, 0.1);
        }

        .intensity-btn.active {
            background: var(--slider-thumb);
            color: white;
            border-color: var(--slider-thumb);
        }

        /* ========================================
           Responsive Design
           ======================================== */
        @media (max-width: 768px) {
            body {
                padding-top: 20vh;
            }

            .time {
                font-size: 88px;
                letter-spacing: 0;
            }

            .quote {
                font-size: 15px;
                padding: 0 32px;
                margin-top: 28px;
            }

            .lacan-title {
                margin-bottom: 16px;
                font-size: 12px;
            }

            .rsi-strip {
                gap: 8px;
                margin-top: 24px;
            }

            .quote-author {
                font-size: 14px;
            }

            .theme-toggle {
                top: 20px;
                right: 20px;
                width: 48px;
                height: 26px;
            }

            .toggle-thumb {
                width: 20px;
                height: 20px;
            }

            .settings-btn {
                bottom: 20px;
                right: 20px;
                width: 40px;
                height: 40px;
            }

            .settings-panel {
                bottom: 74px;
                right: 20px;
                width: calc(100% - 40px);
                max-width: 320px;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-top: 18vh;
                padding-left: 16px;
                padding-right: 16px;
            }

            .time {
                font-size: 64px;
                letter-spacing: 0;
            }

            .quote {
                font-size: 14px;
                margin-top: 24px;
                padding: 0 8px;
                line-height: 1.6;
            }

            .quote-author {
                font-size: 13px;
                margin-top: 10px;
            }

            .theme-toggle {
                top: 16px;
                right: 16px;
                width: 44px;
                height: 24px;
                border-radius: 12px;
            }

            .theme-toggle .toggle-thumb {
                width: 18px;
                height: 18px;
            }

            [data-theme="dark"] .toggle-thumb {
                transform: translateX(20px);
            }

            .settings-btn {
                bottom: 16px;
                right: 16px;
                width: 36px;
                height: 36px;
            }

            .gear-icon {
                width: 18px;
                height: 18px;
            }

            .settings-panel {
                bottom: 66px;
                right: 16px;
                left: 16px;
                width: auto;
                max-width: none;
                padding: 12px;
                border-radius: 8px;
            }

            .settings-title {
                font-size: 15px;
                margin-bottom: 12px;
                padding-bottom: 8px;
            }

            .setting-item {
                margin-bottom: 12px;
            }

            .setting-label {
                font-size: 12px;
            }

            .intensity-btn {
                padding: 6px 8px;
                font-size: 11px;
            }

            .toggle-switch {
                width: 32px;
                height: 18px;
            }

            .toggle-slider {
                border-radius: 9px;
            }

            .toggle-slider:before {
                height: 14px;
                width: 14px;
            }

            input:checked + .toggle-slider:before {
                transform: translateX(14px);
            }
        }

        /* ========================================
           Small Height Screens (Landscape Mobile)
           ======================================== */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding-top: 10vh;
            }

            .time {
                font-size: 48px;
                letter-spacing: 0;
            }

            .quote {
                font-size: 12px;
                margin-top: 16px;
            }

            .quote-author {
                font-size: 11px;
                margin-top: 6px;
            }

            .lacan-title,
            .rsi-strip {
                display: none;
            }

            .settings-panel {
                bottom: 60px;
            }

            #waveformCanvas {
                max-height: 80px;
            }
        }

        /* ========================================
           Very Small Screens (iPhone SE / Small Android)
           ======================================== */
        @media (max-width: 360px) {
            .time {
                font-size: 52px;
            }

            .quote {
                font-size: 13px;
            }
        }

        /* ========================================
           Touch Device Optimizations
           ======================================== */
        @media (hover: none) and (pointer: coarse) {
            /* Disable parallax on touch devices */
            .parallax-wrapper {
                transform: none !important;
                perspective: none !important;
                animation: none !important;
            }

            /* Improve touch targets */
            .theme-toggle,
            .settings-btn,
            .intensity-btn {
                min-height: 44px;
                min-width: 44px;
            }

            .theme-toggle {
                padding: 4px;
            }

            /* Disable hover effects that cause issues on touch */
            .theme-toggle:hover,
            .settings-btn:hover,
            .intensity-btn:hover {
                transform: none;
                background: inherit;
            }

            /* Active state feedback for touch */
            .theme-toggle:active,
            .settings-btn:active,
            .intensity-btn:active {
                transform: scale(0.95);
            }

            .range-slider::-webkit-slider-thumb {
                width: 20px;
                height: 20px;
            }

            .range-slider::-moz-range-thumb {
                width: 20px;
                height: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            .time,
            .lacan-title,
            .rsi-strip {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
                filter: none !important;
            }

            .parallax-wrapper {
                transform: none !important;
                perspective: none !important;
            }

            .quote,
            .quote-author,
            .theme-toggle,
            .toggle-thumb,
            .settings-btn,
            .settings-panel,
            #waveformCanvas,
            .dictionary-chain-links {
                transition: none !important;
            }

            .quote-text.typing::after {
                animation: none;
            }
        }

        /* ========================================
           Signifier Chain Canvas
           ======================================== */
        #waveformCanvas {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            max-height: 200px;
            pointer-events: none;
            z-index: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #waveformCanvas.hidden {
            opacity: 0;
            filter: blur(30px);
        }

        .dictionary-chain-links {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            max-height: 200px;
            pointer-events: none;
            z-index: 1;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dictionary-chain-links.hidden {
            opacity: 0;
            filter: blur(30px);
        }

        .dictionary-chain-link {
            position: absolute;
            color: var(--text-secondary);
            font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
            font-size: 13px;
            font-weight: 600;
            line-height: 1;
            padding: 4px 6px;
            border-radius: 4px;
            text-decoration: none;
            white-space: nowrap;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            transition: color 0.2s ease, background 0.2s ease;
        }

        .dictionary-chain-link:hover,
        .dictionary-chain-link:focus-visible {
            color: var(--accent);
            background: var(--panel-bg);
            outline: none;
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">
        <div class="toggle-thumb">
            <svg class="toggle-icon" viewBox="0 0 24 24">

            </svg>
        </div>
    </button>

    <!-- Signifier Chain Canvas -->
    <canvas id="waveformCanvas"></canvas>
    <div class="dictionary-chain-links" id="dictionaryChainLinks" aria-label="觉心词典链接"></div>

    <!-- Settings Gear Button -->
    <button class="settings-btn" id="settingsBtn" aria-label="设置">
        <svg class="gear-icon" viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
    </button>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">分析设置</div>

        <!-- Clock Font Size -->
        <div class="setting-item">
            <div class="setting-label">
                <span>时间字体大小</span>
                <span class="setting-value" id="clockSizeValue">160px</span>
            </div>
            <input type="range" class="range-slider" id="clockSizeSlider"
                   min="80" max="200" value="160">
        </div>

        <!-- Quote Font Size -->
        <div class="setting-item">
            <div class="setting-label">
                <span>话语字体大小</span>
                <span class="setting-value" id="quoteSizeValue">22px</span>
            </div>
            <input type="range" class="range-slider" id="quoteSizeSlider"
                   min="14" max="28" value="22">
        </div>

        <!-- Author Font Size -->
        <div class="setting-item">

            clockSize: 160,
            quoteSize: 22,
            authorSize: 18,
            position: 25,
            parallaxIntensity: 6,
            waveEnabled: true

        // Load settings from localStorage or use defaults
        function loadSettings() {
            const saved = localStorage.getItem('clockSettings');
            if (saved) {
                return { ...defaultSettings, ...JSON.parse(saved) };
            }
            return { ...defaultSettings };
        }

        // Save settings to localStorage
        function saveSettings(settings) {
            localStorage.setItem('clockSettings', JSON.stringify(settings));
        }

        function getResponsiveClockMax() {
            const availableWidth = Math.max(window.innerWidth - 32, 0);
            return Math.max(80, Math.min(200, Math.floor(availableWidth / 3.55)));
        }

        // Keep the clock inside the viewport even when a saved desktop size is applied inline.
        function adjustSliderRanges() {
            const clockSlider = document.getElementById('clockSizeSlider');
            const responsiveMax = getResponsiveClockMax();

            if (parseInt(clockSlider.value) > responsiveMax) {
                clockSlider.value = responsiveMax;
            }
            clockSlider.max = responsiveMax;
        }

        // Apply settings
        function applySettings(settings) {
            // Adjust slider ranges for mobile first
            adjustSliderRanges();
            const effectiveClockSize = Math.min(settings.clockSize, parseInt(document.getElementById('clockSizeSlider').max));

            // Apply font sizes
            timeDisplay.style.fontSize = effectiveClockSize + 'px';
            document.getElementById('clockSizeValue').textContent = effectiveClockSize + 'px';
            document.getElementById('clockSizeSlider').value = effectiveClockSize;

            document.querySelector('.quote').style.fontSize = settings.quoteSize + 'px';
            document.getElementById('quoteSizeValue').textContent = settings.quoteSize + 'px';
            document.getElementById('quoteSizeSlider').value = settings.quoteSize;

            document.querySelector('.quote-author').style.fontSize = settings.authorSize + 'px';
            document.getElementById('authorSizeValue').textContent = settings.authorSize + 'px';
            document.getElementById('authorSizeSlider').value = settings.authorSize;

            // Apply position
            document.body.style.paddingTop = settings.position + 'vh';
            document.getElementById('positionValue').textContent = settings.position + 'vh';
            document.getElementById('positionSlider').value = settings.position;

            // Apply parallax intensity
            parallaxIntensity = settings.parallaxIntensity;
            updateParallaxButtons(settings.parallaxIntensity);

            // Apply wave toggle
            document.getElementById('waveToggle').checked = settings.waveEnabled;
            if (settings.waveEnabled) {
                waveform.canvas.classList.remove('hidden');
                waveform.linkLayer.classList.remove('hidden');
            } else {
                waveform.canvas.classList.add('hidden');
                waveform.linkLayer.classList.add('hidden');
            }
        }

        // Update parallax intensity buttons
        function updateParallaxButtons(value) {
            document.querySelectorAll('.intensity-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.value) === value);
            });

        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateClock() {
            const now = new Date();
            timeDisplay.textContent = formatTime(now);
        }

        function getRandomQuote() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * quotes.length);
            } while (newIndex === currentQuoteIndex && quotes.length > 1);

            currentQuoteIndex = newIndex;
            return quotes[newIndex];
        }

        function startQuoteLoop() {
            clearTimeout(quoteCycleTimer);
            quoteDisplay.classList.add('visible');
            runQuoteCycle();
        }

        function runQuoteCycle() {
            const quote = getRandomQuote();
            quoteAuthor.textContent = `— ${quote.author}`;
            quoteAuthor.classList.remove('is-hidden');
            typeQuote(`"${quote.text}"`, () => {
                quoteCycleTimer = setTimeout(() => {
                    quoteAuthor.classList.add('is-hidden');
                    deleteQuote(() => {
                        quoteCycleTimer = setTimeout(runQuoteCycle, 600);
                    });
                }, 2400);
            });
        }

        function typeQuote(text, onComplete) {
            let index = 0;
            quoteText.textContent = '';

            if (reducedMotionQuery.matches) {
                quoteText.textContent = text;
                quoteText.classList.remove('typing');
                onComplete();
                return;
            }

            quoteText.classList.add('typing');

            function typeNextCharacter() {
                quoteText.textContent = text.slice(0, index);
                index += 1;

                if (index <= text.length) {
                    quoteCycleTimer = setTimeout(typeNextCharacter, 86);
                    return;
                }

                onComplete();
            }

            typeNextCharacter();
        }

        function deleteQuote(onComplete) {
            let index = quoteText.textContent.length;

            if (reducedMotionQuery.matches) {
                quoteText.textContent = '';
                quoteText.classList.remove('typing');
                onComplete();
                return;
            }

            quoteText.classList.add('typing');

            function deletePreviousCharacter() {
                quoteText.textContent = quoteText.textContent.slice(0, index);
                index -= 1;

                if (index >= 0) {
                    quoteCycleTimer = setTimeout(deletePreviousCharacter, 54);
                    return;
                }

                quoteText.classList.remove('typing');
                onComplete();
            }

            deletePreviousCharacter();
        }

        // ========================================
        // Parallax 2.5D Effect
        // ========================================
        const parallaxWrapper = document.querySelector('.parallax-wrapper');
        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;
        let parallaxEnabled = true;

        // Check if device supports hover (non-touch devices)
        const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        const prefersReducedMotion = reducedMotionQuery.matches;

        if (isTouchDevice || prefersReducedMotion) {
            parallaxEnabled = false;
            if (parallaxWrapper) {
                parallaxWrapper.style.transform = 'none';
            }
        } else {
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
        }

        function animateParallax() {
            if (!parallaxEnabled) return;

            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const offsetX = (currentX - centerX) / centerX;
            const offsetY = (currentY - centerY) / centerY;

            if (parallaxWrapper) {
                parallaxWrapper.style.transform = `perspective(1000px) rotateY(${offsetX * parallaxIntensity}deg) rotateX(${-offsetY * parallaxIntensity}deg)`;
            }

            requestAnimationFrame(animateParallax);
        }

        class WaveformRenderer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.linkLayer = document.getElementById('dictionaryChainLinks');

                // Chain configuration - 3 overlapping dictionary paths
                this.waveCount = 3;
                this.waves = [];
                this.linkNodes = [];
                this.visibleLinkCursor = 0;
                this.initWaves();
                this.initLinks();

                // Canvas dimensions
                this.width = 0;
                this.height = 0;

                // Handle resize
                window.addEventListener('resize', () => this.resize());
                this.resize();
            }

            initLinks() {
                this.linkLayer.textContent = '';

                for (let index = 0; index < 24; index++) {
                    const link = document.createElement('a');
                    link.className = 'dictionary-chain-link';
                    link.dataset.index = String(index);
                    this.linkLayer.appendChild(link);
                    this.linkNodes.push(link);
                }
            }

            initWaves() {
                for (let i = 0; i < this.waveCount; i++) {
                    this.waves.push({
                        amplitude: 12 + Math.random() * 18,
                        frequency: 0.002 + Math.random() * 0.003,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.002 + Math.random() * 0.004,
                        baseY: 0.32 + (i * 0.14)
                    });
                }
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.width = window.innerWidth;
                this.height = Math.min(window.innerHeight * 0.25, 200);

                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.ctx.scale(dpr, dpr);

                this.canvas.style.height = this.height + 'px';
                this.linkLayer.style.height = this.height + 'px';
                this.canvas.classList.remove('hidden');
                this.linkLayer.classList.remove('hidden');
            }

            drawWaveLine(wave, time) {
                const ctx = this.ctx;
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const centerY = this.height * wave.baseY;

                ctx.beginPath();

                for (let x = 0; x <= this.width; x += 3) {
                    const y = centerY +
                        Math.sin(x * wave.frequency + wave.phase + time * wave.speed * 100) * wave.amplitude;

                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                // Create gradient for the line
                const gradient = ctx.createLinearGradient(0, 0, this.width, 0);

                // Base opacity varies by chain index (outer chains are more subtle)
                const waveOpacity = 0.28 - (this.waves.indexOf(wave) * 0.06);

                if (isDark) {
                    gradient.addColorStop(0, `rgba(243, 232, 208, 0)`);
                    gradient.addColorStop(0.1, `rgba(243, 232, 208, ${waveOpacity * 0.3})`);
                    gradient.addColorStop(0.5, `rgba(193, 100, 79, ${waveOpacity})`);
                    gradient.addColorStop(0.9, `rgba(243, 232, 208, ${waveOpacity * 0.3})`);
                    gradient.addColorStop(1, `rgba(243, 232, 208, 0)`);
                } else {
                    gradient.addColorStop(0, `rgba(27, 23, 19, 0)`);
                    gradient.addColorStop(0.1, `rgba(27, 23, 19, ${waveOpacity * 0.18})`);
                    gradient.addColorStop(0.5, `rgba(158, 63, 49, ${waveOpacity * 0.85})`);
                    gradient.addColorStop(0.9, `rgba(27, 23, 19, ${waveOpacity * 0.18})`);
                    gradient.addColorStop(1, `rgba(27, 23, 19, 0)`);
                }

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            positionLinks(wave, time) {
                const waveIndex = this.waves.indexOf(wave);
                const centerY = this.height * wave.baseY;
                const spacing = 152 + waveIndex * 34;
                const drift = (time * 15 * (waveIndex + 1)) % spacing;

                for (let x = -spacing; x <= this.width + spacing; x += spacing) {
                    const drawX = x + drift;
                    const y = centerY +
                        Math.sin(drawX * wave.frequency + wave.phase + time * wave.speed * 100) * wave.amplitude;
                    const link = this.linkNodes[this.visibleLinkCursor % this.linkNodes.length];
                    const rotationBatch = Math.floor(time / 5);
                    const termIndex = Math.abs(Math.floor((x / spacing) + waveIndex * 13 + rotationBatch * 17)) % dictionaryTerms.length;
                    const item = dictionaryTerms[termIndex];

                    link.href = item.href;
                    link.textContent = item.term;
                    link.title = `打开觉心词典：${item.term}`;
                    link.style.left = `${drawX}px`;
                    link.style.top = `${y - 15}px`;
                    link.style.opacity = drawX > -80 && drawX < this.width + 80 ? '1' : '0';
                    this.visibleLinkCursor += 1;
                }
            }

            render() {
                const time = reducedMotionQuery.matches ? 0 : Date.now() / 1000;

                // Clear canvas
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.visibleLinkCursor = 0;
                this.linkNodes.forEach(link => {
                    link.style.opacity = '0';
                });

                // Draw all waves
                for (const wave of this.waves) {
                    this.drawWaveLine(wave, time);
                    this.positionLinks(wave, time);
                }

                requestAnimationFrame(() => this.render());
            }

            start() {
                this.render();
            }
        }

        // Initialize waveform
        const waveform = new WaveformRenderer('waveformCanvas');
        waveform.start();

        // Smooth theme transition for waveform
        let themeTransitionTimeout;
        function smoothThemeTransition() {
            // Briefly hide to reset gradients
            waveform.canvas.classList.add('hidden');
            waveform.linkLayer.classList.add('hidden');
            clearTimeout(themeTransitionTimeout);
            themeTransitionTimeout = setTimeout(() => {
                waveform.canvas.classList.remove('hidden');
                waveform.linkLayer.classList.remove('hidden');
            }, 300);
        }

        // Listen for theme changes
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'data-theme') {
                    smoothThemeTransition();
                }
            });
        });

        observer.observe(document.documentElement, { attributes: true });

        let settingsResizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(settingsResizeTimeout);
            settingsResizeTimeout = setTimeout(() => {
                applySettings(loadSettings());
            }, 120);
        });

        // Initialize
        initTheme();
        const settings = loadSettings();
        applySettings(settings);
        updateClock();
        startQuoteLoop();
        setInterval(updateClock, 1000);
    </script>
